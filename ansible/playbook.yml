---
- name: Docker em todas as VMs
  hosts: all
  become: true
  tasks:
    - name: Dependências
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        update_cache: true
        state: present

    - name: Criar diretório de chaves
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Chave GPG da Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Repositório da Docker
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable"
        filename: docker
        state: present

    - name: Instalar Docker CE e Compose v2
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        update_cache: true
        state: present

    - name: Habilitar Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: VM2 - API e MySQL
  hosts: db
  become: true
  vars:
    mysql_root_password: "troque_root"
    mysql_password: "troque_app"
  tasks:
    - name: Copiar projeto da API
      ansible.builtin.copy:
        src: ../api/
        dest: /opt/api/

    - name: Criar .env
      ansible.builtin.copy:
        dest: /opt/api/.env
        mode: "0600"
        content: |
          MYSQL_ROOT_PASSWORD={{ mysql_root_password }}
          MYSQL_PASSWORD={{ mysql_password }}
          WEB_ORIGIN=http://{{ hostvars[groups['web'][0]].ansible_host }}

    - name: Subir API e MySQL
      community.docker.docker_compose_v2:
        project_src: /opt/api
        build: always
        state: present

- name: VM1 - Aplicação web
  hosts: web
  become: true
  tasks:
    - name: Copiar projeto web
      ansible.builtin.copy:
        src: ../app/
        dest: /opt/app/

    - name: Criar .env
      ansible.builtin.copy:
        dest: /opt/app/.env
        mode: "0600"
        content: |
          API_URL=http://{{ hostvars[groups['db'][0]].ansible_host }}:3000

    - name: Subir aplicação web
      community.docker.docker_compose_v2:
        project_src: /opt/app
        build: always
        state: present